apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: amf-http-echo-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amf-http-echo
  template:
    metadata:
      labels: # This label is used by the service to find the pods
        app: amf-http-echo
    spec:
      containers:
        - name: amf-http-echo
          image: antoniomarfer/http-echo
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  namespace: default
  name: amf-http-echo-service
spec:
  type: NodePort
  selector:
    app: amf-http-echo # From deployment above
  ports:
    - protocol: TCP
      targetPort: 8080 # Deployment port
      port: 8080 # Service port
      nodePort: 30080 # Node port. Allowed values: 30000-32767